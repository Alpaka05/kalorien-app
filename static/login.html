<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>Anmelden – Kalorien-Tagebuch</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="auth">
  <h1>Kalorien-Tagebuch</h1>
  <p class="subtitle">Melde dich mit deiner E-Mail-Adresse an. Ein Passwort brauchst du nicht.</p>

  <form class="auth-step" id="step-email">
    <input type="email" id="email-input" placeholder="deine@mail.de" autocomplete="email" required />
    <button type="submit" id="request-btn">Code anfordern</button>
  </form>

  <form class="auth-step" id="step-code" hidden>
    <p class="subtitle" id="code-hint" style="margin-bottom:0"></p>
    <input type="text" id="code-input" class="auth-code" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="123456" required />
    <button type="submit" id="verify-btn">Anmelden</button>
    <button type="button" class="link auth-back" id="back-btn">Andere E-Mail-Adresse verwenden</button>
  </form>

  <p class="message" id="auth-msg"></p>
  <p class="footnote">Beim ersten erfolgreichen Code wird automatisch ein Konto angelegt. Jedes Konto sieht nur seine eigenen Einträge.</p>
</div>

<script src="/login.js"></script>
</body>
</html>
