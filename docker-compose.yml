services:
  kalorien-tagebuch:
    build: .
    container_name: kalorien-tagebuch
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Zeitzone für Datum und Uhrzeit der Einträge
      - APP_TZ=${APP_TZ:-Europe/Berlin}
    volumes:
      - ./data:/app/data
